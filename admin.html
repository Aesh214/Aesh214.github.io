    const portfolioDB = indexedDB.open("AyshaPortfolio", 1);

portfolioDB.onupgradeneeded = function (event) {
    const db = event.target.result;

    if (!db.objectStoreNames.contains("files")) {
        db.createObjectStore("files", {
            keyPath: "id",
            autoIncrement: true
        });
    }
};

portfolioDB.onerror = function () {
    console.log("Portfolio storage could not be opened.");
};

const profileStore =

const profileRequest = profileStore.getAll();
